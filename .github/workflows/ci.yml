name: CI

# 兑现 README「可审计」与 CHANGELOG 里「GitHub Actions 每次提交都跑自检」的承诺。
# 本仓库只用 Python 标准库，README 声明支持 Python 3.9+，故矩阵取 3.9 与 3.12。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-check:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest 现在指向 26.04，而 actions/setup-python 没有为 26.04
          # 提供 3.9 的构建（manifest 里只有 22.04 / 24.04），所以 3.9 那格必须钉 24.04。
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # 结构 / frontmatter / docx 冒烟 / 隐私扫描，全部由仓库自带脚本完成。
      # --repo-only 表示不要求本地 config.json，正合 CI 场景。
      - name: Self-check
        run: python scripts/validate.py --repo-only
